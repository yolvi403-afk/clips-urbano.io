<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips Urbano</title>
  <style>
    :root { --verde: #22e06b; --verde-claro: #7dff9f; --negro: #050505; --gris: #111; --gris2: #1a1a1a; --borde: #1f3d2a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--negro); color: #e8ffe8; font-family: Arial, sans-serif; min-height: 100vh; }

    #login { position: fixed; inset: 0; background: var(--negro); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    .tarjeta { width: 100%; max-width: 340px; background: var(--gris); border: 1px solid var(--borde); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
    .tarjeta h2 { margin: 0; color: var(--verde); text-align: center; }
    .tarjeta input { padding: 12px; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; }
    .tarjeta button { padding: 12px; background: var(--verde); color: #000; font-weight: bold; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; }
    .tarjeta .enlace { background: none; color: var(--verde); border: 1px solid var(--verde); padding: 10px; font-size: .9rem; }
    .err { margin: 0; color: #ff8a8a; text-align: center; font-size: .9rem; min-height: 1.2em; }
    #formRegistro { display: none; }

    header { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--borde); }
    .logo { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--verde), #0a7a35); display: grid; place-items: center; color: #000; font-weight: bold; }
    header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: var(--verde); text-transform: uppercase; flex: 1; }
    .salir { background: none; color: #9fd9b0; border: 1px solid var(--borde); border-radius: 20px; padding: 6px 12px; font-size: .8rem; cursor: pointer; }

    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }

    .buscar { display: flex; align-items: center; background: #000; border: 2px solid var(--verde); border-radius: 40px; padding: 4px 4px 4px 16px; box-shadow: 0 0 14px rgba(34,224,107,.25); }
    .buscar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; padding: 10px 0; }
    .buscar input::placeholder { color: #777; }
    .buscar button { width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 50%; background: linear-gradient(90deg, var(--verde), var(--verde-claro)); color: #000; font-size: 1.4rem; font-weight: bold; cursor: pointer; }

    .ajustes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; background: var(--gris2); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; }
    .ajustes .full { grid-column: 1 / -1; }
    .ajustes label { font-size: .8rem; color: #9fd9b0; display: grid; gap: 6px; }
    .ajustes input { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; }

    .acciones { margin-top: 14px; }
    .acciones button { width: 100%; padding: 10px; background: var(--gris); color: var(--verde); border: 1px solid var(--verde); border-radius: 10px; font-size: .9rem; cursor: pointer; }

    #msg { text-align: center; color: #9fd9b0; min-height: 1.2em; margin: 14px 0 0; font-size: .95rem; }

    .lista { display: grid; gap: 14px; margin-top: 10px; }
    .card { background: var(--gris); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; }
    .cab { display: flex; align-items: center; gap: 10px; }
    .num { flex-shrink: 0; background: var(--verde); color: #000; font-weight: bold; font-size: .85rem; border-radius: 8px; padding: 6px 9px; }
    .tema { flex: 1; min-width: 0; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 9px 10px; font-size: .95rem; }
    .tema:focus { outline: none; border-color: var(--verde); }
    .tiempo { font-size: .8rem; color: var(--verde-claro); margin: 8px 0; }

    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--borde); }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .play { background: var(--verde); color: #000; border: none; border-radius: 30px; padding: 10px 20px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .play:hover { opacity: .85; }
  </style>
</head>
<body>

  <div id="login">
    <form id="formLogin" class="tarjeta">
      <h2>Iniciar sesión</h2>
      <input id="usuario" placeholder="Usuario" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="errLogin" class="err"></p>
      <button type="button" class="enlace" id="irRegistro">Crear cuenta nueva</button>
    </form>

    <form id="formRegistro" class="tarjeta">
      <h2>Crear cuenta</h2>
      <input id="nuevoUsuario" placeholder="Nuevo usuario (mínimo 3)" autocomplete="off" required>
      <input id="nuevaClave" type="password" placeholder="Contraseña (mínimo 4)" autocomplete="new-password" required>
      <input id="nuevaClave2" type="password" placeholder="Repite la contraseña" autocomplete="new-password" required>
      <button type="submit">Registrarse</button>
      <p id="errRegistro" class="err"></p>
      <button type="button" class="enlace" id="irLogin">Volver a iniciar sesión</button>
    </form>
  </div>

  <header>
    <div class="logo">▶</div>
    <h1>Clips Urbano</h1>
    <button class="salir" id="salir">Salir</button>
  </header>

  <main>
    <div class="buscar">
      <input id="url" type="text" placeholder="Pega un enlace de YouTube">
      <button id="gen" aria-label="Generar clips">→</button>
    </div>

    <div class="ajustes">
      <label class="full">Tema general (opcional)
        <input id="tema" type="text" placeholder="Ej: Barrio, Rap, Entrevista">
      </label>
      <label>Duración del video (min)
        <input id="duracion" type="number" min="1" value="10">
      </label>
      <label>Duración por clip (seg)
        <input id="clipSeg" type="number" min="5" value="15">
      </label>
    </div>

    <div class="acciones">
      <button id="btnGuardar">Descargar data.json actualizado</button>
    </div>

    <p id="msg"></p>
    <div class="lista" id="clips"></div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const ARCHIVO_DATOS = 'data.json';
    const USUARIO_ADMIN = 'yolvi';
    const CLAVE_ADMIN = 'MiClaveSegura-2026'; // Cambia esta clave por la tuya

    // Cuentas leídas de data.json (del repositorio)
    let usuariosRepo = [];
    // Cuentas creadas en este navegador
    let usuariosLocales = JSON.parse(localStorage.getItem('cu_usuarios') || '[]');

    async function hashClave(texto) {
      const datos = new TextEncoder().encode(texto);
      const hash = await crypto.subtle.digest('SHA-256', datos);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function todosLosUsuarios() {
      const mapa = new Map();
      [...usuariosRepo, ...usuariosLocales].forEach(u => mapa.set(u.usuario.toLowerCase(), u));
      return [...mapa.values()];
    }

    function ocultarLogin() {
      $('login').style.setProperty('display', 'none', 'important');
    }

    function mostrarForm(cual) {
      $('formLogin').style.display = cual === 'login' ? 'grid' : 'none';
      $('formRegistro').style.display = cual === 'registro' ? 'grid' : 'none';
    }
    $('irRegistro').onclick = () => { mostrarForm('registro'); $('errLogin').textContent = ''; };
    $('irLogin').onclick = () => { mostrarForm('login'); $('errRegistro').textContent = ''; };

    // ---------- Iniciar sesión ----------
    $('formLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const usuario = $('usuario').value.trim().toLowerCase();
      const clave = $('clave').value;
      const hash = await hashClave(clave);

      const esAdmin = usuario === USUARIO_ADMIN && clave === CLAVE_ADMIN;
      const cuenta = todosLosUsuarios().find(u => u.usuario.toLowerCase() === usuario);
      const valida = esAdmin || (cuenta && cuenta.hash === hash);

      if (valida) {
        sessionStorage.setItem('cu_ok', '1');
        sessionStorage.setItem('cu_usuario', usuario);
        $('errLogin').textContent = '';
        ocultarLogin();
      } else {
        $('errLogin').textContent = 'Usuario o contraseña incorrectos.';
        $('clave').value = '';
      }
    });

    // ---------- Registro ----------
    $('formRegistro').addEventListener('submit', async e => {
      e.preventDefault();
      const usuario = $('nuevoUsuario').value.trim();
      const clave = $('nuevaClave').value;
      const clave2 = $('nuevaClave2').value;
      const existe = todosLosUsuarios().some(u => u.usuario.toLowerCase() === usuario.toLowerCase());

      if (usuario.length < 3) {
        $('errRegistro').textContent = 'El usuario debe tener al menos 3 caracteres.';
      } else if (clave.length < 4) {
        $('errRegistro').textContent = 'La contraseña debe tener al menos 4 caracteres.';
      } else if (clave !== clave2) {
        $('errRegistro').textContent = 'Las contraseñas no coinciden.';
      } else if (existe || usuario.toLowerCase() === USUARIO_ADMIN) {
        $('errRegistro').textContent = 'Ese usuario ya existe.';
      } else {
        const hash = await hashClave(clave);
        usuariosLocales.push({ usuario, hash, creado: new Date().toISOString() });
        localStorage.setItem('cu_usuarios', JSON.stringify(usuariosLocales));
        sessionStorage.setItem('cu_ok', '1');
        sessionStorage.setItem('cu_usuario', usuario);
        $('errRegistro').textContent = '';
        ocultarLogin();
        $('msg').textContent = 'Cuenta creada. Descarga data.json y súbelo al repositorio para guardarla.';
      }
    });

    $('salir').onclick = () => {
      sessionStorage.removeItem('cu_ok');
      sessionStorage.removeItem('cu_usuario');
      location.reload();
    };

    // ---------- Clips ----------
    function videoId(url) {
      try {
        let texto = url.trim();
        if (!/^https?:\/\//i.test(texto)) texto = 'https://' + texto;
        const u = new URL(texto);
        let id = null;
        if (u.hostname.includes('youtu.be')) {
          id = u.pathname.slice(1, 12);
        } else if (u.hostname.includes('youtube.com')) {
          id = u.searchParams.get('v');
          if (!id) {
            const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{11})/);
            id = m ? m[1] : null;
          }
        }
        return id && /^[A-Za-z0-9_-]{11}$/.test(id.slice(0, 11)) ? id.slice(0, 11) : null;
      } catch (e) {
        return null;
      }
    }

    function fmt(s) {
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function crearTitulo(i, total, tema) {
      const base = tema.trim() || 'Clip Urbano';
      let etiqueta;
      if (i === 0) etiqueta = 'Inicio';
      else if (i === total - 1) etiqueta = 'Final';
      else etiqueta = 'Momento ' + (i + 1);
      return base + ' · ' + etiqueta;
    }

    function datosActuales() {
      const clips = [...document.querySelectorAll('.card')].map((card, i) => ({
        numero: i + 1,
        titulo: card.querySelector('.tema').value,
        tiempo: card.querySelector('.tiempo').textContent
      }));
      return {
        usuarios: todosLosUsuarios(),
        url: $('url').value,
        tema: $('tema').value,
        duracion: parseFloat($('duracion').value) || 10,
        clipSeg: parseFloat($('clipSeg').value) || 15,
        clips
      };
    }

    function generar(titulos) {
      const id = videoId($('url').value);
      const total = parseFloat($('duracion').value) * 60;
      const len = parseFloat($('clipSeg').value);
      const tema = $('tema').value;
      const msg = $('msg');
      const lista = $('clips');

      lista.innerHTML = '';
      if (!id) { msg.textContent = 'Link de YouTube no válido.'; return; }
      if (!total || !len || len >= total) { msg.textContent = 'Revisa las duraciones.'; return; }
      msg.textContent = '';

      const cantidad = 10;
      const paso = (total - len) / (cantidad - 1);
      for (let i = 0; i < cantidad; i++) {
        const ini = Math.round(i * paso);
        const fin = Math.round(ini + len);

        const card = document.createElement('div');
        card.className = 'card';

        const cab = document.createElement('div');
        cab.className = 'cab';
        const num = document.createElement('span');
        num.className = 'num';
        num.textContent = String(i + 1).padStart(2, '0');
        const titulo = document.createElement('input');
        titulo.className = 'tema';
        titulo.type = 'text';
        titulo.value = (titulos && titulos[i]) || crearTitulo(i, cantidad, tema);
        cab.append(num, titulo);

        const tiempo = document.createElement('div');
        tiempo.className = 'tiempo';
        tiempo.textContent = fmt(ini) + ' - ' + fmt(fin);

        const player = document.createElement('div');
        player.className = 'player';
        const btn = document.createElement('button');
        btn.className = 'play';
        btn.textContent = '▶ Reproducir';
        btn.onclick = () => {
          const nombre = titulo.value.trim() || 'Clip ' + (i + 1);
          player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?start=${ini}&end=${fin}&autoplay=1"
            title="${nombre.replace(/"/g, '')}" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        };
        player.appendChild(btn);

        card.append(cab, tiempo, player);
        lista.appendChild(card);
      }
    }

    // ---------- Leer data.json del repositorio ----------
    async function cargarDataJson() {
      try {
        const r = await fetch(ARCHIVO_DATOS + '?v=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error('no encontrado');
        const d = await r.json();
        usuariosRepo = Array.isArray(d.usuarios) ? d.usuarios : [];
        $('url').value = d.url || '';
        $('tema').value = d.tema || '';
        $('duracion').value = d.duracion || 10;
        $('clipSeg').value = d.clipSeg || 15;
        const titulos = (d.clips || []).map(c => c.titulo);
        generar(titulos.length ? titulos : null);
        $('msg').textContent = 'Datos cargados desde data.json.';
      } catch (e) {
        $('msg').textContent = 'No se pudo leer data.json. Revisa que esté en el repositorio.';
      }
    }

    // ---------- Descargar data.json actualizado ----------
    $('btnGuardar').onclick = () => {
      const blob = new Blob([JSON.stringify(datosActuales(), null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'data.json';
      a.click();
      URL.revokeObjectURL(a.href);
      $('msg').textContent = 'Descargado. Súbelo al repositorio para reemplazar el anterior.';
    };

    // ---------- Inicio ----------
    $('gen').onclick = () => generar(null);
    $('url').addEventListener('keydown', e => { if (e.key === 'Enter') generar(null); });

    if (sessionStorage.getItem('cu_ok') === '1') ocultarLogin();
    cargarDataJson();
  </script>
</body>
</html>

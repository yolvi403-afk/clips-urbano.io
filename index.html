<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clips Urbano</title>
  <style>
    :root { --verde: #22e06b; --verde-claro: #7dff9f; --negro: #050505; --gris: #111; --gris2: #1a1a1a; --borde: #1f3d2a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--negro); color: #e8ffe8; font-family: Arial, sans-serif; min-height: 100vh; }

    #login { position: fixed; inset: 0; background: var(--negro); display: flex; align-items: center; justify-content: center; z-index: 999; padding: 16px; }
    #formLogin { width: 100%; max-width: 340px; background: var(--gris); border: 1px solid var(--borde); border-radius: 14px; padding: 20px; display: grid; gap: 12px; }
    #formLogin h2 { margin: 0; color: var(--verde); text-align: center; }
    #formLogin input { padding: 12px; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; }
    #formLogin button { padding: 12px; background: var(--verde); color: #000; font-weight: bold; border: none; border-radius: 30px; font-size: 1rem; cursor: pointer; }
    #errLogin { margin: 0; color: #ff8a8a; text-align: center; font-size: .9rem; min-height: 1.2em; }

    header { display: flex; align-items: center; gap: 10px; padding: 18px 16px; border-bottom: 1px solid var(--borde); }
    .logo { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--verde), #0a7a35); display: grid; place-items: center; color: #000; font-weight: bold; }
    header h1 { margin: 0; font-size: 1.3rem; letter-spacing: 2px; color: var(--verde); text-transform: uppercase; flex: 1; }
    .salir { background: none; color: #9fd9b0; border: 1px solid var(--borde); border-radius: 20px; padding: 6px 12px; font-size: .8rem; cursor: pointer; }

    main { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }

    .buscar { display: flex; align-items: center; background: #000; border: 2px solid var(--verde); border-radius: 40px; padding: 4px 4px 4px 16px; box-shadow: 0 0 14px rgba(34,224,107,.25); }
    .buscar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: #fff; font-size: 1rem; padding: 10px 0; }
    .buscar input::placeholder { color: #777; }
    .buscar button { width: 48px; height: 48px; flex-shrink: 0; border: none; border-radius: 50%; background: linear-gradient(90deg, var(--verde), var(--verde-claro)); color: #000; font-size: 1.4rem; font-weight: bold; cursor: pointer; }

    .ajustes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; background: var(--gris2); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; }
    .ajustes .full { grid-column: 1 / -1; }
    .ajustes label { font-size: .8rem; color: #9fd9b0; display: grid; gap: 6px; }
    .ajustes input { width: 100%; padding: 10px; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; font-size: 1rem; }

    .acciones { margin-top: 14px; }
    .acciones button { width: 100%; padding: 10px; background: var(--gris); color: var(--verde); border: 1px solid var(--verde); border-radius: 10px; font-size: .9rem; cursor: pointer; }

    #msg { text-align: center; color: #ff8a8a; min-height: 1.2em; margin: 14px 0 0; font-size: .95rem; }

    .lista { display: grid; gap: 14px; margin-top: 10px; }
    .card { background: var(--gris); border: 1px solid var(--borde); border-radius: 14px; padding: 14px; }
    .cab { display: flex; align-items: center; gap: 10px; }
    .num { flex-shrink: 0; background: var(--verde); color: #000; font-weight: bold; font-size: .85rem; border-radius: 8px; padding: 6px 9px; }
    .tema { flex: 1; min-width: 0; background: #000; color: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 9px 10px; font-size: .95rem; }
    .tema:focus { outline: none; border-color: var(--verde); }
    .tiempo { font-size: .8rem; color: var(--verde-claro); margin: 8px 0; }

    .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; border: 1px solid var(--borde); }
    .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .play { background: var(--verde); color: #000; border: none; border-radius: 30px; padding: 10px 20px; font-weight: bold; font-size: 1rem; cursor: pointer; }
    .play:hover { opacity: .85; }
  </style>
</head>
<body>

  <div id="login">
    <form id="formLogin">
      <h2>Iniciar sesión</h2>
      <input id="usuario" placeholder="Usuario" autocomplete="username" required>
      <input id="clave" type="password" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit">Entrar</button>
      <p id="errLogin"></p>
    </form>
  </div>

  <header>
    <div class="logo">▶</div>
    <h1>Clips Urbano</h1>
    <button class="salir" id="salir">Salir</button>
  </header>

  <main>
    <div class="buscar">
      <input id="url" type="text" placeholder="Pega un enlace de YouTube">
      <button id="gen" aria-label="Generar clips">→</button>
    </div>

    <div class="ajustes">
      <label class="full">Tema general (opcional)
        <input id="tema" type="text" placeholder="Ej: Barrio, Rap, Entrevista">
      </label>
      <label>Duración del video (min)
        <input id="duracion" type="number" min="1" value="10">
      </label>
      <label>Duración por clip (seg)
        <input id="clipSeg" type="number" min="5" value="15">
      </label>
    </div>

    <div class="acciones">
      <button id="btnGuardar">Descargar data.json actualizado</button>
    </div>

    <p id="msg"></p>
    <div class="lista" id="clips"></div>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const ARCHIVO_DATOS = 'data.json';

    // ---------- Cuenta (la clave se compara en hash, no en texto) ----------
    async function hashClave(texto) {
      const datos = new TextEncoder().encode(texto);
      const hash = await crypto.subtle.digest('SHA-256', datos);
      return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // Hash de la clave 12345 y usuario yolvi
    const USUARIO_OK = 'yolvi';
    const HASH_OK = '5994471abb01112afcc18159f6cc74b4f511b99806da59b3caf5a9c173cacfc5';

    $('formLogin').addEventListener('submit', async e => {
      e.preventDefault();
      const hash = await hashClave($('clave').value);
      if ($('usuario').value.trim() === USUARIO_OK && hash === HASH_OK) {
        sessionStorage.setItem('cu_ok', '1');
        $('login').style.display = 'none';
      } else {
        $('errLogin').textContent = 'Usuario o contraseña incorrectos.';
        $('clave').value = '';
      }
    });

    $('salir').onclick = () => {
      sessionStorage.removeItem('cu_ok');
      location.reload();
    };

    // ---------- Clips ----------
    function videoId(url) {
      try {
        let texto = url.trim();
        if (!/^https?:\/\//i.test(texto)) texto = 'https://' + texto;
        const u = new URL(texto);
        let id = null;
        if (u.hostname.includes('youtu.be')) {
          id = u.pathname.slice(1, 12);
        } else if (u.hostname.includes('youtube.com')) {
          id = u.searchParams.get('v');
          if (!id) {
            const m = u.pathname.match(/\/(?:shorts|embed|live|v)\/([A-Za-z0-9_-]{11})/);
            id = m ? m[1] : null;
          }
        }
        return id && /^[A-Za-z0-9_-]{11}$/.test(id.slice(0, 11)) ? id.slice(0, 11) : null;
      } catch (e) {
        return null;
      }
    }

    function fmt(s) {
      const m = Math.floor(s / 60), r = Math.floor(s % 60);
      return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
    }

    function crearTitulo(i, total, tema) {
      const base = tema.trim() || 'Clip Urbano';
      let etiqueta;
      if (i === 0) etiqueta = 'Inicio';
      else if (i === total - 1) etiqueta = 'Final';
      else etiqueta = 'Momento ' + (i + 1);
      return base + ' · ' + etiqueta;
    }

        numero: i + 1,
        titulo: card.querySelector('.tema').value,
        tiempo: card.querySelector('.tiempo').textContent
      }));
      return {
        usuario: USUARIO_OK,
        url: $('url').value,
        tema: $('tema').value,
        duracion: parseFloat($('duracion').value) || 10,
        clipSeg: parseFloat($('clipSeg').value) || 15,
        clips
      };
    }
